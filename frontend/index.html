<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>Callix · Voice AI Security for developers</title>
    <meta name="description" content="The best way to protect users from synthetic voice scams and impersonation fraud. Deliver real-time telecommunication AI security at scale." />
    <!-- Preload 3D Spline Cube Scene immediately so it's ready at millisecond 0 -->
    <link rel="preload" href="/cube.splinecode" as="fetch" crossorigin="anonymous" />
    <script>
      window.__splineCubePromise = fetch('/cube.splinecode')
        .then(function(res) {
          if (!res.ok) throw new Error('Fetch failed: ' + res.status);
          return res.arrayBuffer();
        })
        .catch(function(err) {
          console.warn('Spline early prefetch error:', err);
          return null;
        });
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-black text-zinc-100 antialiased min-h-screen overflow-x-hidden selection:bg-white/20 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
